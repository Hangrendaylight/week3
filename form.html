<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">

</head>
<body>
    <img src="swin_logo.png" alt="swinburne logo">
    <h1>CWA Help Desk Appointment</h1>
    <p>The Help Desk is located in ATC620 Open 10:30 to 19:00 Monday to Friday<br>Check Blackboard for whom CWA tutors will be there</p>
    <fieldset>
        <legend>student details</legend>
        <label for="Student-ID">Student ID:</label>
        <input type="text" id="Student-ID" name="Student-ID" required size="10" maxlength="20">
        <br>
        <label for="given-name">Given name:</label>
        <input type="text" id="given-name" name="given-name" required size="10" maxlength="20">
        <label for="last-name">Last name:</label>
        <input type="text" id="last-name" name="last-name" required size="10" maxlength="20">
        <br>
    </fieldset>
    <fieldset>
        <legend>Your unit</legend>
        <input type="radio" id="unit1" name="COS10011" value="COS10011">
        <label for="unit1">COS10011</label>
        <input type="radio" id="unit2" name="COS60004" value="COS60004">
        <label for="unit2">COS60004</label>
        <input type="radio" id="unit3" name="COS60007" value="COS60007">
        <label for="unit3">COS60007</label>
    </fieldset>
</body>
</html>
